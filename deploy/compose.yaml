name: smartdrop
x-app: &app
  image: smartdrop:local
  build:
    context: ..
    dockerfile: Dockerfile
  env_file: .env.production
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: smartdrop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure deploy/.env.production}
      POSTGRES_DB: smartdrop
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdrop -d smartdrop"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    command: ["node_modules/.bin/tsx", "scripts/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  app:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      start_period: 40s
      retries: 5
  worker:
    <<: *app
    command: ["node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      HOST_DOMAIN: ${HOST_DOMAIN:?Configure deploy/.env.production}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: { condition: service_healthy }
volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
